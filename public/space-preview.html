<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Space studies — Yubin</title><style>
*{box-sizing:border-box}body{margin:0;background:#03050b;color:#e8edf6;font:14px/1.5 system-ui}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}aside{position:fixed;right:20px;bottom:20px;width:340px;max-width:calc(100% - 24px);padding:20px;background:#0a1020ed;border:1px solid #ffffff25;border-radius:16px;backdrop-filter:blur(24px);box-shadow:0 12px 60px #0007}h1{font-size:20px;margin:5px 0}small{font:10px monospace;letter-spacing:2px;color:#99abc5}p{font-size:12px;color:#b3bfd2}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #ffffff30;border-radius:8px;background:#ffffff05;padding:9px}button[aria-pressed=true]{background:#dce8ff;color:#091222}.options{display:grid;grid-template-columns:1fr 1fr;gap:6px}label{display:flex;gap:10px;font-size:12px;margin-top:14px}input{min-width:0;flex:1;accent-color:#adc9ff}output{width:35px}.actions{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}.actions button{font-size:12px}#status{min-height:36px}#restore{position:fixed;right:16px;bottom:16px;background:#0a1020ed;display:none}.hidden aside{display:none}.hidden #restore{display:block}button:focus-visible{outline:2px solid #add2ff;outline-offset:3px}@media(max-width:600px){aside{right:12px;bottom:12px;padding:14px}label{margin-top:9px}}
</style><iframe id="site" src="index.html" title="포트폴리오 배경 미리보기"></iframe><aside><small>BACKGROUND STUDIES / 01</small><h1>조금 더 깊은 우주로.</h1><p id="description"></p><div class="options"><button data-mode="original">기존 · 컬러 조명</button><button data-mode="deep">A · 깊은 별바다</button><button data-mode="nebula">B · 희미한 성운</button><button data-mode="orbit">C · 행성의 가장자리</button></div><label>밝기<input id="light" aria-label="배경 밝기" type="range" min="20" max="100"><output id="lv"></output></label><label>움직임<input id="speed" aria-label="움직임 속도" type="range" min="0" max="100"><output id="sv"></output></label><div class="actions"><button id="pause">일시정지</button><button id="hide">화면만 보기</button><button id="save">이 시안 선택</button><button id="share">링크 복사</button></div><p id="status" role="status">선택은 이 브라우저에 저장돼요. 실제 홈은 그대로예요.</p></aside><button id="restore">배경 비교 열기</button><script>
const $=s=>document.querySelector(s),frame=$('#site'),modes=['original','deep','nebula','orbit'],desc={original:'현재의 넓은 컬러 조명. 새 시안과 밝기·공간감을 비교해보세요.',deep:'추천 · 거의 검은 남색과 거리가 다른 별 세 겹. 가장 차분하고 글에 집중하기 좋아요.',nebula:'희미한 청보라 성운과 별의 깊이. 기존 컬러 무드를 우주 쪽으로 이어가요.',orbit:'먼 행성의 어두운 곡면과 가는 대기광. 공간의 크기가 가장 분명해요.'};let mode='deep',light=55,speed=35,paused=matchMedia('(prefers-reduced-motion:reduce)').matches,dispose=()=>{};
try{const s=JSON.parse(localStorage.getItem('yubin-space-study'));if(s&&modes.includes(s.mode)){mode=s.mode;light=s.light;speed=s.speed}}catch{}const q=new URLSearchParams(location.search);if(modes.includes(q.get('space')))mode=q.get('space');if(q.has('light'))light=Number(q.get('light'));if(q.has('speed'))speed=Number(q.get('speed'));light=Number.isFinite(light)?Math.max(20,Math.min(100,light)):55;speed=Number.isFinite(speed)?Math.max(0,Math.min(100,speed)):35;
function build(){dispose();dispose=()=>{};const d=frame.contentDocument,wnd=frame.contentWindow;if(!d?.body||mode==='original')return;const style=d.createElement('style');style.textContent='html.dark{--bg:#03050b;--muted:#b1bbcf}html.dark body::before,html.dark body::after{content:none!important}html.dark body{isolation:isolate}#space-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}html:not(.dark) #space-layer{display:none}';d.head.append(style);const c=d.createElement('canvas');c.id='space-layer';c.setAttribute('aria-hidden','true');d.body.prepend(c);const ctx=c.getContext('2d');if(!ctx){c.remove();style.remove();return}let w,h,raf,t=0,last=0,px=0,py=0,tx=0,ty=0,seed=946;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296},stars=Array.from({length:240},()=>({x:rnd(),y:rnd(),z:rnd(),p:rnd()*6.28})),reduce=wnd.matchMedia('(prefers-reduced-motion:reduce)');
const resize=()=>{w=wnd.innerWidth;h=wnd.innerHeight;const ratio=Math.min(wnd.devicePixelRatio||1,1.5);c.width=w*ratio;c.height=h*ratio;ctx.setTransform(ratio,0,0,ratio,0,0)},pointer=e=>{tx=e.clientX/w-.5;ty=e.clientY/h-.5};
function glow(x,y,r,col){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
function render(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;const moving=!paused&&!reduce.matches&&!d.hidden;if(moving){t+=dt*speed/100;px+=(tx-px)*.025;py+=(ty-py)*.025}ctx.globalAlpha=1;ctx.fillStyle='#03050b';ctx.fillRect(0,0,w,h);ctx.globalAlpha=light/100;if(mode==='nebula'){glow(w*.72+Math.sin(t*.06)*w*.025,h*.32,w*.52,'#15274a');glow(w*.26,h*.78,w*.43,'#201330');glow(w*.63,h*.58,w*.26,'#0b2630')}else if(mode==='deep')glow(w*.77,h*.25,w*.52,'#0a1729');else{const r=Math.max(w,h)*.63,x=w*1.05,y=h*.72;ctx.save();ctx.translate(px*4,py*4);const g=ctx.createRadialGradient(x-r*.6,y-r*.7,0,x,y,r);g.addColorStop(0,'#0d1b2f');g.addColorStop(.65,'#060b14');g.addColorStop(1,'#020308');ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fillStyle=g;ctx.fill();ctx.shadowColor='#7aafff';ctx.shadowBlur=13;ctx.strokeStyle='#315279';ctx.lineWidth=1.3;ctx.stroke();ctx.restore()}
for(const s of stars){const z=.15+s.z*s.z,x=((s.x*w+t*(1+z)*5+px*z*16)%w+w)%w,y=((s.y*h+py*z*12-wnd.scrollY*.012*z)%h+h)%h;ctx.globalAlpha=light/100*(.18+z*.55)*(moving?.84+Math.sin(t*.65+s.p)*.16:1);ctx.fillStyle='#c1d0e8';ctx.beginPath();ctx.arc(x,y,.25+s.z*.85,0,6.283);ctx.fill()}ctx.globalAlpha=1;raf=wnd.requestAnimationFrame(render)}resize();wnd.addEventListener('resize',resize);wnd.addEventListener('pointermove',pointer,{passive:true});raf=wnd.requestAnimationFrame(render);dispose=()=>{wnd.cancelAnimationFrame(raf);wnd.removeEventListener('resize',resize);wnd.removeEventListener('pointermove',pointer);c.remove();style.remove()}}
function sync(){document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('#description').textContent=desc[mode];$('#light').value=light;$('#speed').value=speed;$('#lv').value=light+'%';$('#sv').value=speed+'%';$('#light').disabled=$('#speed').disabled=$('#pause').disabled=mode==='original';$('#pause').textContent=paused?'움직임 재생':'일시정지';const u=new URL(location.href);u.searchParams.set('space',mode);u.searchParams.set('light',light);u.searchParams.set('speed',speed);history.replaceState(null,'',u)}
frame.addEventListener('load',()=>{build();frame.contentDocument.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('hidden')})});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;sync();build();$('#status').textContent='비교 중 · 마음에 들면 이 시안 선택을 눌러주세요.'});$('#light').oninput=e=>{light=Number(e.target.value);sync()};$('#speed').oninput=e=>{speed=Number(e.target.value);sync()};$('#pause').onclick=()=>{paused=!paused;sync()};$('#hide').onclick=()=>document.body.classList.add('hidden');$('#restore').onclick=()=>document.body.classList.remove('hidden');addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('hidden')});$('#save').onclick=()=>{try{localStorage.setItem('yubin-space-study',JSON.stringify({mode,light,speed}));$('#status').textContent='선택 저장됨 · '+$('[data-mode="'+mode+'"]').textContent+' / 밝기 '+light+'% / 움직임 '+speed+'%'}catch{$('#status').textContent='저장할 수 없어요. 링크를 복사해두세요.'}};$('#share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('#status').textContent='시안과 조절값이 담긴 링크를 복사했어요.'}catch{$('#status').textContent='주소창의 링크를 복사해주세요.'}};sync();addEventListener('pagehide',()=>dispose());
</script></html>
