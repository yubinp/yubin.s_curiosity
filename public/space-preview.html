</style><iframe id="site" src="index.html" title="포트폴리오 배경 미리보기"></iframe><aside><small>BACKGROUND STUDIES / 02</small><h1>빛은 살리고, 선은 조용하게.</h1><p id="description"></p><div class="options"><button data-mode="original">기존 · 그대로 비교</button><button data-mode="color">컬러 · 움직이는 빛</button><button data-mode="edge">행성 · 오른쪽 여백</button><button data-mode="shadow">행성 · 선 없는 그림자</button><button data-mode="deep">A · 깊은 별바다</button><button data-mode="nebula">B · 희미한 성운</button><button data-mode="orbit">C · 행성의 가장자리</button></div><label>밝기<input id="light" aria-label="배경 밝기" type="range" min="20" max="100"><output id="lv"></output></label><label>움직임<input id="speed" aria-label="움직임 속도" type="range" min="0" max="100"><output id="sv"></output></label><label>색감<input id="saturation" aria-label="색감" type="range" min="0" max="150"><output id="satv"></output></label><label>빛 크기<input id="size" aria-label="빛 크기" type="range" min="40" max="140"><output id="sizev"></output></label><label>이동 폭<input id="amplitude" aria-label="이동 폭" type="range" min="0" max="100"><output id="ampv"></output></label><label>별<input id="stars" aria-label="별 강도" type="range" min="0" max="100"><output id="starv"></output></label><div class="actions"><button id="pause">일시정지</button><button id="hide">화면만 보기</button><button id="save">이 시안 선택</button><button id="share">링크 복사</button></div><p id="status" role="status">선택은 이 브라우저에 저장돼요. 실제 홈은 그대로예요.</p></aside><button id="restore">배경 비교 열기</button><script>
const $=s=>document.querySelector(s),frame=$('#site'),modes=['original','color','edge','shadow','deep','nebula','orbit'],desc={color:'추천 · 기존 청록·파랑·보라·살구빛을 독립적으로 움직여요. 별은 원하는 만큼만 겹쳐보세요.',edge:'행성은 화면 오른쪽 15% 안에만. 글이 있는 영역은 부드럽게 지워 선이 지나가지 않아요.',shadow:'윤곽선 없이 어두운 곡면과 넓은 대기광만. 컬러 빛 위에 크기와 깊이를 더해요.',original:'현재의 넓은 컬러 조명. 새 시안과 밝기·공간감을 비교해보세요.',deep:'추천 · 거의 검은 남색과 거리가 다른 별 세 겹. 가장 차분하고 글에 집중하기 좋아요.',nebula:'희미한 청보라 성운과 별의 깊이. 기존 컬러 무드를 우주 쪽으로 이어가요.',orbit:'먼 행성의 어두운 곡면과 가는 대기광. 공간의 크기가 가장 분명해요.'};let mode='color',light=55,speed=35,paused=matchMedia('(prefers-reduced-motion:reduce)').matches,dispose=()=>{};
const extra={saturation:70,size:100,amplitude:45,stars:15};
try{const s=JSON.parse(localStorage.getItem('yubin-space-study'));if(s&&modes.includes(s.mode)){mode=s.mode;light=s.light;speed=s.speed;for(const k in extra)if(Number.isFinite(s[k]))extra[k]=s[k]}}catch{}const q=new URLSearchParams(location.search);if(modes.includes(q.get('space')))mode=q.get('space');if(q.has('light'))light=Number(q.get('light'));if(q.has('speed'))speed=Number(q.get('speed'));light=Number.isFinite(light)?Math.max(20,Math.min(100,light)):55;speed=Number.isFinite(speed)?Math.max(0,Math.min(100,speed)):35;
for(const k in extra){const max=k==='saturation'?150:k==='size'?140:100,min=k==='size'?40:0;extra[k]=Math.max(min,Math.min(max,q.has(k)&&Number.isFinite(Number(q.get(k)))?Number(q.get(k)):extra[k]))}
function build(){dispose();dispose=()=>{};const d=frame.contentDocument,wnd=frame.contentWindow;if(!d?.body||mode==='original')return;const style=d.createElement('style');style.textContent='html.dark{--bg:#03050b;--muted:#b1bbcf}html.dark body::before,html.dark body::after{content:none!important}html.dark .bg-field{display:none!important}html.dark body{isolation:isolate}#space-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}html:not(.dark) #space-layer{display:none}';d.head.append(style);const c=d.createElement('canvas');c.id='space-layer';c.setAttribute('aria-hidden','true');d.body.prepend(c);const planet=d.createElement('canvas');const ctx=c.getContext('2d');if(!ctx){c.remove();style.remove();return}let safeBoxes=[],w,h,raf,t=0,last=0,px=0,py=0,tx=0,ty=0,seed=946;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296},stars=Array.from({length:240},()=>({x:rnd(),y:rnd(),z:rnd(),p:rnd()*6.28})),reduce=wnd.matchMedia('(prefers-reduced-motion:reduce)');
const resize=()=>{w=wnd.innerWidth;h=wnd.innerHeight;const ratio=Math.min(wnd.devicePixelRatio||1,1.5);c.width=w*ratio;c.height=h*ratio;planet.width=c.width;planet.height=c.height;ctx.setTransform(ratio,0,0,ratio,0,0)},pointer=e=>{tx=e.clientX/w-.5;ty=e.clientY/h-.5};
function glow(x,y,r,col){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
const measure=()=>{safeBoxes=[...d.querySelectorAll('h1,h2,h3,.hero-questions,.v15-hero-intro,.v15-hero-method,.project-copy,.q-belt')].map(e=>e.getBoundingClientRect()).filter(b=>b.bottom>0&&b.top<h)};wnd.addEventListener('scroll',measure,{passive:true});
function render(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;const moving=!paused&&!reduce.matches&&!d.hidden;if(moving){t+=dt*speed/100;px+=(tx-px)*.025;py+=(ty-py)*.025}ctx.globalAlpha=1;ctx.fillStyle='#03050b';ctx.fillRect(0,0,w,h);ctx.globalAlpha=light/100;if(['color','edge','shadow'].includes(mode)){const scale=extra.size/100,amp=extra.amplitude/100,base=Math.max(w,h),lights=[['#36d1b0',.10,.16,.45,0],['#4f7dff',.92,.26,.43,2],['#c38bff',.72,.94,.46,4],['#ffb08a',.16,.86,.36,6]];ctx.save();ctx.filter='saturate('+extra.saturation/100+')';for(const [col,x,y,r,phase] of lights){glow(w*x+Math.sin(t*.23+phase)*base*.14*amp,h*y+Math.cos(t*.19+phase)*base*.12*amp,base*r*scale,col)}ctx.restore();}
if(mode==='nebula'){glow(w*.72+Math.sin(t*.06)*w*.025,h*.32,w*.52,'#15274a');glow(w*.26,h*.78,w*.43,'#201330');glow(w*.63,h*.58,w*.26,'#0b2630')}else if(mode==='deep')glow(w*.77,h*.25,w*.52,'#0a1729');else if(mode==='orbit'){const r=Math.max(w,h)*.63,x=w*1.05,y=h*.72;ctx.save();ctx.translate(px*4,py*4);const g=ctx.createRadialGradient(x-r*.6,y-r*.7,0,x,y,r);g.addColorStop(0,'#0d1b2f');g.addColorStop(.65,'#060b14');g.addColorStop(1,'#020308');ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fillStyle=g;ctx.fill();ctx.shadowColor='#7aafff';ctx.shadowBlur=13;ctx.strokeStyle='#315279';ctx.lineWidth=1.3;ctx.stroke();ctx.restore()}
if(mode==='edge'||mode==='shadow'){const layer=planet;const lc=layer.getContext('2d');lc.setTransform(1,0,0,1,0,0);lc.clearRect(0,0,layer.width,layer.height);lc.globalCompositeOperation='source-over';lc.filter='none';lc.shadowBlur=0;lc.setTransform(c.width/w,0,0,c.height/h,0,0);const r=Math.max(w,h)*.72,x=w*.86+r,y=h*.63;lc.beginPath();lc.arc(x,y,r,0,6.283);const g=lc.createRadialGradient(x-r*.7,y-r*.55,0,x,y,r);g.addColorStop(0,'#132337');g.addColorStop(.7,'#040810');g.addColorStop(1,'#010207');lc.fillStyle=g;lc.fill();if(mode==='edge'){lc.strokeStyle='#537aa0';lc.lineWidth=.7;lc.shadowColor='#8fbaff';lc.shadowBlur=12;lc.stroke()}else{lc.shadowBlur=60;lc.shadowColor='#5480ad';lc.strokeStyle='#172b40';lc.lineWidth=18;lc.stroke()}lc.globalCompositeOperation='destination-in';const mask=lc.createLinearGradient(w*.82,0,w,0);mask.addColorStop(0,'transparent');mask.addColorStop(.7,'#000');mask.addColorStop(1,'#000');lc.fillStyle=mask;lc.fillRect(0,0,w,h);/* Fade around visible text, including after scrolling. */lc.globalCompositeOperation='destination-out';lc.filter='blur(24px)';lc.fillStyle='#000';for(const box of safeBoxes){lc.fillRect(box.left-35,box.top-25,box.width+70,box.height+50)}ctx.globalAlpha=light/100;ctx.drawImage(layer,0,0,w,h)}
for(const s of stars){const z=.15+s.z*s.z,x=((s.x*w+t*(1+z)*5+px*z*16)%w+w)%w,y=((s.y*h+py*z*12-wnd.scrollY*.012*z)%h+h)%h;ctx.globalAlpha=(['color','edge','shadow'].includes(mode)?extra.stars/100:1)*light/100*(.18+z*.55)*(moving?.84+Math.sin(t*.65+s.p)*.16:1);ctx.fillStyle='#c1d0e8';ctx.beginPath();ctx.arc(x,y,.25+s.z*.85,0,6.283);ctx.fill()}ctx.globalAlpha=1;raf=wnd.requestAnimationFrame(render)}resize();measure();const onResize=()=>{resize();measure()};wnd.addEventListener('resize',onResize);wnd.addEventListener('pointermove',pointer,{passive:true});raf=wnd.requestAnimationFrame(render);dispose=()=>{wnd.cancelAnimationFrame(raf);wnd.removeEventListener('scroll',measure);wnd.removeEventListener('resize',onResize);wnd.removeEventListener('pointermove',pointer);c.remove();style.remove()}}
function sync(){document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('#description').textContent=desc[mode];$('#light').value=light;$('#speed').value=speed;$('#lv').value=light+'%';$('#sv').value=speed+'%';$('#light').disabled=$('#speed').disabled=$('#pause').disabled=mode==='original';$('#pause').textContent=paused?'움직임 재생':'일시정지';for(const [k,id] of Object.entries({saturation:'satv',size:'sizev',amplitude:'ampv',stars:'starv'})){$('#'+k).value=extra[k];$('#'+id).value=extra[k]+'%';$('#'+k).disabled=!['color','edge','shadow'].includes(mode)}const u=new URL(location.href);for(const k in extra)u.searchParams.set(k,extra[k]);u.searchParams.set('space',mode);u.searchParams.set('light',light);u.searchParams.set('speed',speed);history.replaceState(null,'',u)}
frame.addEventListener('load',()=>{build();frame.contentDocument.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('hidden')})});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;sync();build();$('#status').textContent='비교 중 · 마음에 들면 이 시안 선택을 눌러주세요.'});for(const k in extra)$('#'+k).oninput=e=>{extra[k]=Number(e.target.value);sync()};$('#light').oninput=e=>{light=Number(e.target.value);sync()};$('#speed').oninput=e=>{speed=Number(e.target.value);sync()};$('#pause').onclick=()=>{paused=!paused;sync()};$('#hide').onclick=()=>document.body.classList.add('hidden');$('#restore').onclick=()=>document.body.classList.remove('hidden');addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('hidden')});$('#save').onclick=()=>{try{localStorage.setItem('yubin-space-study',JSON.stringify({mode,light,speed,...extra}));$('#status').textContent='선택 저장됨 · '+$('[data-mode="'+mode+'"]').textContent+' / 밝기 '+light+'% / 움직임 '+speed+'%'}catch{$('#status').textContent='저장할 수 없어요. 링크를 복사해두세요.'}};$('#share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('#status').textContent='시안과 조절값이 담긴 링크를 복사했어요.'}catch{$('#status').textContent='주소창의 링크를 복사해주세요.'}};sync();addEventListener('pagehide',()=>dispose());
</script></html>
