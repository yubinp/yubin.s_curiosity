<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Typography studies — Yubin</title><style>
*{box-sizing:border-box}body{margin:0;background:#05080e;color:#ecf0f8;font:14px/1.5 system-ui}#stage{position:fixed;inset:0;overflow:auto;display:flex;justify-content:center}iframe{display:block;width:100%;height:100%;border:0;background:#06070b;flex-shrink:0}#stage.phone iframe{width:390px;max-width:100%;box-shadow:0 0 0 1px #fff3}aside{position:fixed;right:16px;bottom:16px;padding:18px;width:350px;max-width:calc(100% - 24px);max-height:calc(100dvh - 32px);overflow:auto;border:1px solid #ffffff30;border-radius:16px;background:#0b1322f5;box-shadow:0 12px 60px #0008;backdrop-filter:blur(20px)}h1{font-size:19px;margin:5px 0}small{font-size:10px;letter-spacing:2px;color:#a5b5ca}p{font-size:12px;color:#b5c2d5;margin:10px 0}button,select,input{font:inherit;color:inherit}button,select{border:1px solid #ffffff35;background:#152033;border-radius:7px;padding:8px;cursor:pointer}select{max-width:100%;width:100%}label{display:flex;align-items:center;gap:10px;font-size:12px;margin:12px 0}input[type=range]{flex:1;min-width:0;accent-color:#bdd6ff}output{width:48px;text-align:right;font-variant-numeric:tabular-nums}.row{display:flex;gap:7px;flex-wrap:wrap}.row button{flex:1;font-size:12px}button[aria-pressed=true]{background:#deebff;color:#101a2b}#status{min-height:36px}#open{display:none;position:fixed;right:16px;bottom:16px}.hidden aside{display:none}.hidden #open{display:block}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #c2ddff;outline-offset:3px}hr{border:0;border-top:1px solid #fff2;margin:16px 0}
</style><div id="stage"><iframe id="site" title="타이포 조절 미리보기" src="index.html"></iframe></div><aside><small>TYPOGRAPHY STUDIES / 01</small><h1>읽어보면서 맞춰보자.</h1><p>7단계 제안에서 시작해요. 바꾼 값은 이 비교 화면에만 적용돼요.</p><label>페이지<select id="page"><option value="index">메인</option><option value="ctr">CTR</option><option value="krust">Catalina</option><option value="system">Admin</option><option value="info">About</option><option value="research">Lab</option></select></label><div class="row"><button id="desktop" aria-pressed="true">데스크톱</button><button id="phone" aria-pressed="false">폰 390px</button><button id="language">EN / KR 전환</button></div><hr><label>조절할 글<select id="group"></select></label><p id="hint"></p><label>크기<input id="size" type="range" min="9" max="100" step="1"><output id="sizeValue"></output></label><label>굵기<select id="weight"><option>400</option><option>450</option><option>500</option><option>550</option><option>600</option></select></label><label>행간<input id="line" type="range" min="1" max="2.2" step="0.05"><output id="lineValue"></output></label><label>자간<input id="tracking" type="range" min="-0.08" max="0.12" step="0.005"><output id="trackingValue"></output></label><label>한글 본문 행간<input id="koLine" type="range" min="1.4" max="2" step="0.05"><output id="koValue"></output></label><div class="row"><button id="about28">About 제목 28</button><button id="about32">About 제목 32</button></div><p>폰 모드에서는 폰 크기만 바뀌어요. 메인 프로젝트 설명은 본문 15px, 한글 본문은 행간 1.7로 시작해요. Boldonse는 행간 1.4·자간 0.</p><div class="row"><button id="compare" aria-pressed="true">조정안 보는 중</button><button id="mark" aria-pressed="false">대상 표시</button><button id="jump">대상으로 이동</button></div><div class="row" style="margin-top:8px"><button id="reset">제안값으로 초기화</button><button id="save">설정 저장</button><button id="share">링크 복사</button><button id="hide">화면만 보기</button></div><p id="status" role="status">실제 사이트 타이포는 아직 바뀌지 않았어요.</p></aside><button id="open">타이포 조절 열기</button><script>
const $=s=>document.querySelector(s),frame=$('#site'),pages=['index','ctr','krust','system','info','research'];
const definitions={
 large:{label:'Boldonse · 큰 제목',selector:'.v15-home-intro h1,.simple-hero h1',hint:'메인과 About의 큰 제목',d:66,m:30,w:400,l:1.4,t:0},
 title:{label:'Boldonse · 페이지·섹션 제목',selector:'.case-hero h1,.research-intro h1,.chapter-heading h2,.v15-shared-method h2,.research-teaser h2,.scraps-head h2',hint:'케이스 페이지와 섹션 제목',d:38,m:24,w:400,l:1.4,t:0},
 subL:{label:'소제목 L',selector:'.project-copy h2,.independent-card h2',hint:'메인 프로젝트 제목과 Lab 카드 제목',d:28,m:22,w:500,l:1.25,t:-.025},
 subM:{label:'소제목 M',selector:'.fold>summary,.v15-method-steps strong,.v14-proof h3,.case-decision-map h3,.v15-method-case h3,.v15-transfer h3,.story-addition h3,.v14-next-test h3,.evidence-addition h3,.case-tradeoff h3,.chapter-body h3,.design-question h3',hint:'펼침 질문, 접근법 질문, 결과 상자 제목',d:21,m:18,w:500,l:1.35,t:-.015},
 lead:{label:'리드',selector:'.chapter-body .chapter-lead,.v15-hero-copy .v15-hero-intro,.hero-questions,.chapter-q,.v15-method-lead,.case-hero>p',hint:'핵심 문단, 메인 소개, 질문 줄',d:17,m:15,w:400,l:1.5,t:-.01},
 body:{label:'본문',selector:'.chapter-body>p:not(.chapter-lead),.fold-body p,.fold-body li,.v15-hero-method,.project-copy p,.simple-content p,.with-me li',hint:'본문과 펼친 내용. 메인 프로젝트 설명도 15px 유지',d:15,m:15,w:400,l:1.6,t:0},
 small:{label:'작은 글',selector:'.case-decision-map p,.case-tradeoff p,.v14-proof p,.v15-method-steps p,.v15-method-grid p,.independent-card p,.case-decision-steps p',hint:'카드 안 설명과 Lab 카드 본문',d:13,m:13,w:400,l:1.5,t:0},
 caption:{label:'캡션',selector:'figcaption,.chart-caption,.hero-cases-note,footer p,footer small,.site-version',hint:'그림 캡션, 휠 아래 설명, 푸터',d:12,m:12,w:400,l:1.5,t:0},
 label:{label:'라벨',selector:'.eyebrow,.tags,.case-eyebrow,.art-index,.v15-method-steps>div>span',hint:'섹션 라벨, 카드 태그, 히어로 라벨. 대문자는 영어만',d:11,m:11,w:600,l:1.4,t:.08},
 about:{label:'About · When I’m working',selector:'.info-grid>h2',hint:'About 소제목을 28과 32로 비교해보세요',d:32,m:22,w:500,l:1.25,t:-.025}
};
const defaults=()=>({groups:Object.fromEntries(Object.entries(definitions).map(([k,v])=>[k,{d:v.d,m:v.m,w:v.w,l:v.l,t:v.t}])),koLine:1.7});let config=defaults(),page='index',phone=false,enabled=true,marked=false,group='body';
function validate(raw){const out=defaults();for(const k in definitions){const v=raw?.groups?.[k];if(!v)continue;for(const [field,min,max] of [['d',9,100],['m',9,100],['w',400,600],['l',1,2.2],['t',-.08,.12]])if(Number.isFinite(v[field]))out.groups[k][field]=Math.max(min,Math.min(max,v[field]));}if(Number.isFinite(raw?.koLine))out.koLine=Math.max(1.4,Math.min(2,raw.koLine));return out}
const query=new URLSearchParams(location.search);try{config=validate(JSON.parse(query.get('type')||localStorage.getItem('yubin-type-study')||'null'))}catch{}if(pages.includes(query.get('page')))page=query.get('page');phone=query.get('phone')==='1';
function css(){let text='';for(const [k,v] of Object.entries(config.groups)){const sels=definitions[k].selector.split(',');const rules=size=>'font-size:'+size+'px!important;font-weight:'+v.w+'!important;line-height:'+v.l+'!important;letter-spacing:'+v.t+'em!important;'+(['large','title'].includes(k)?'font-family:Boldonse,"Pretendard Variable","Noto Sans KR",sans-serif!important;':'');const scope=sels.map(s=>'html body '+s).join(',');text+=scope+'{'+rules(v.d)+'}@media(max-width:760px){'+scope+'{'+rules(v.m)+'}}';}
const body=definitions.body.selector.split(',').map(s=>'html[lang=ko] body '+s).join(',');text+=body+'{line-height:'+config.koLine+'!important}';text+='html[lang=en] body .eyebrow,html[lang=en] body .tags,html[lang=en] body .case-eyebrow,html[lang=en] body .art-index{text-transform:uppercase!important}html[lang=ko] body .eyebrow,html[lang=ko] body .tags,html[lang=ko] body .case-eyebrow,html[lang=ko] body .art-index{text-transform:none!important}';return text}
function targets(){const d=frame.contentDocument;return d?[...d.querySelectorAll(definitions[group].selector)]:[]}
function apply(){const d=frame.contentDocument;if(!d?.body)return;let style=d.getElementById('type-study');if(!style){style=d.createElement('style');style.id='type-study';d.head.append(style)}style.textContent=enabled?css():'';let mark=d.getElementById('type-mark');if(!mark){mark=d.createElement('style');mark.id='type-mark';d.head.append(mark)}mark.textContent=marked?definitions[group].selector.split(',').map(s=>'html body '+s).join(',')+'{outline:1px dashed #ffb477!important;outline-offset:5px}':'';}
function url(){const u=new URL(location.href);u.searchParams.set('type',JSON.stringify(config));u.searchParams.set('page',page);u.searchParams.set('phone',phone?'1':'0');return u}
function sync(){const v=config.groups[group];$('#group').value=group;$('#page').value=page;$('#size').value=phone?v.m:v.d;$('#weight').value=v.w;$('#line').value=v.l;$('#tracking').value=v.t;$('#koLine').value=config.koLine;$('#sizeValue').value=(phone?v.m:v.d)+'px';$('#lineValue').value=v.l;$('#trackingValue').value=v.t+'em';$('#koValue').value=config.koLine;$('#hint').textContent=definitions[group].hint;$('#compare').textContent=enabled?'조정안 보는 중':'기존 보는 중';$('#compare').setAttribute('aria-pressed',String(enabled));$('#mark').setAttribute('aria-pressed',String(marked));$('#stage').classList.toggle('phone',phone);$('#phone').setAttribute('aria-pressed',String(phone));$('#desktop').setAttribute('aria-pressed',String(!phone));history.replaceState(null,'',url());apply()}
for(const [k,v] of Object.entries(definitions)){const o=document.createElement('option');o.value=k;o.textContent=v.label;$('#group').append(o)}
frame.addEventListener('load',()=>{const d=frame.contentDocument;for(const el of d.querySelectorAll('h2,h3'))if(/when\s+i[’']?m\s+working/i.test(el.textContent)){el.classList.add('with-me-title')}const current=frame.contentWindow.location.pathname.split('/').pop().replace(/\.html$/,'')||'index';if(pages.includes(current))page=current;d.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('hidden')});sync()});
$('#page').onchange=e=>{page=e.target.value;frame.src=page+'.html'};$('#group').onchange=e=>{group=e.target.value;sync()};$('#phone').onclick=()=>{phone=true;sync()};$('#desktop').onclick=()=>{phone=false;sync()};$('#language').onclick=()=>{const d=frame.contentDocument,b=d.querySelector('.lang-globe')||d.querySelector('.lang-option[aria-pressed=false]');b?.click()};
for(const [id,key] of [['size',null],['weight','w'],['line','l'],['tracking','t']])$('#'+id).oninput=e=>{config.groups[group][key||(phone?'m':'d')]=Number(e.target.value);sync()};$('#koLine').oninput=e=>{config.koLine=Number(e.target.value);sync()};$('#compare').onclick=()=>{enabled=!enabled;sync()};$('#mark').onclick=()=>{marked=!marked;sync()};$('#jump').onclick=()=>{const el=targets().find(e=>e.getClientRects().length);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});else $('#status').textContent='이 페이지에는 해당 글이 없어요. 다른 페이지에서 확인해보세요.'};
for(const n of [28,32])$('#about'+n).onclick=()=>{config.groups.about[phone?'m':'d']=n;group='about';if(page!=='info'){page='info';frame.src='info.html'}sync()};$('#reset').onclick=()=>{config=defaults();enabled=true;sync();$('#status').textContent='7단계 제안값으로 초기화했어요.'};$('#save').onclick=()=>{try{localStorage.setItem('yubin-type-study',JSON.stringify(config));$('#status').textContent='이 브라우저에 조절값을 저장했어요.'}catch{$('#status').textContent='저장할 수 없어요. 링크를 복사해두세요.'}};$('#share').onclick=async()=>{try{await navigator.clipboard.writeText(url().href);$('#status').textContent='전체 조절값과 페이지가 담긴 링크를 복사했어요.'}catch{$('#status').textContent='주소창의 링크를 복사해주세요.'}};$('#hide').onclick=()=>document.body.classList.add('hidden');$('#open').onclick=()=>document.body.classList.remove('hidden');addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('hidden')});if(page!=='index')frame.src=page+'.html';sync();
</script></html>
